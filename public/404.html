<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Halaman Tidak Ditemukan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #EDE8DC;
      color: #111111;
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 40px 20px;
    }
    .error-code {
      font-family: 'Space Mono', monospace;
      font-size: 120px;
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, #FF6B00, #AAEF45);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: none;
    }
    .error-title {
      font-size: 28px;
      font-weight: 700;
      margin-top: 8px;
      letter-spacing: -0.02em;
    }
    .error-desc {
      font-size: 14px;
      color: #888880;
      font-family: 'Space Mono', monospace;
      margin-top: 8px;
      text-align: center;
      max-width: 400px;
      line-height: 1.6;
    }
    .error-btn {
      margin-top: 24px;
      padding: 12px 32px;
      background: #111111;
      color: #AAEF45;
      border: 2px solid #111111;
      border-radius: 8px;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 4px 4px 0 #555;
      transition: translate 0.12s, box-shadow 0.12s;
    }
    .error-btn:hover {
      translate: -2px -2px;
      box-shadow: 6px 6px 0 #555;
    }
  </style>
</head>
<body>
  <div class="error-code">404</div>
  <div class="error-title">Halaman Tidak Ditemukan</div>
  <div class="error-desc">
    Maaf, halaman yang Anda cari tidak tersedia atau<br />
    Anda tidak memiliki akses untuk melihatnya.
  </div>
  <a href="/" class="error-btn">← Kembali ke Beranda</a>
</body>
</html>
