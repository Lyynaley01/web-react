<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WA Channel Reactor</title>

<style>
*{
 box-sizing:border-box;
 font-family:Inter,Arial,sans-serif;
}

body{
 margin:0;
 min-height:100vh;
 background:
 radial-gradient(circle at top,#1d5c38,#050607 55%);
 display:flex;
 justify-content:center;
 align-items:center;
 padding:20px;
 color:white;
}

.container{
 width:100%;
 max-width:450px;
}

.logo{
 text-align:center;
 margin-bottom:20px;
}

.logo h1{
 font-size:28px;
 margin:10px 0;
}

.logo p{
 color:#aaa;
}

.card{
 background:#10151c;
 border:1px solid #28313d;
 border-radius:25px;
 padding:25px;
 box-shadow:0 20px 60px #0008;
}


label{
 display:block;
 margin-bottom:8px;
 font-size:14px;
 font-weight:bold;
}


input{
 width:100%;
 padding:15px;
 border-radius:15px;
 border:1px solid #333d4a;
 background:#070a0f;
 color:white;
 outline:none;
 margin-bottom:15px;
}

input:focus{
 border-color:#25d366;
}


button{
 width:100%;
 padding:15px;
 border:none;
 border-radius:15px;
 background:#25d366;
 font-weight:bold;
 cursor:pointer;
 font-size:15px;
}


button:disabled{
 opacity:.5;
}


.emojis{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-bottom:15px;
}

.emojis button{
 width:auto;
 padding:8px 12px;
 background:#1c2430;
 color:white;
}


.result{
 margin-top:20px;
 padding:15px;
 border-radius:15px;
 display:none;
 background:#080b10;
 border:1px solid #333;
}


.success{
 border-color:#25d366;
}


.error{
 border-color:red;
}


.loading{
 border-color:#ffc107;
}


small{
 color:#888;
}
</style>

</head>


<body>


<div class="container">

<div class="logo">

<h1>⚡ WA Channel Reactor</h1>

<p>
Auto reaction WhatsApp Channel
</p>

</div>


<div class="card">


<label>
Link Postingan Channel
</label>


<input id="url"
placeholder="https://whatsapp.com/channel/xxxx/123">


<label>
Emoji Reaction
</label>


<input id="emoji"
placeholder="🔥,❤️,😂">


<div class="emojis">

<button onclick="addEmoji('🔥')">🔥</button>
<button onclick="addEmoji('❤️')">❤️</button>
<button onclick="addEmoji('😂')">😂</button>
<button onclick="addEmoji('👍')">👍</button>
<button onclick="addEmoji('😍')">😍</button>

</div>


<button id="send" onclick="react()">
⚡ Kirim Reaction
</button>


<div id="result" class="result"></div>


</div>


</div>



<script>


const API =
"https://api.nexadev.my.id/api/rch";


const KEY =
"enchos";



function addEmoji(e){

let input=document.getElementById("emoji");

if(input.value.trim())
 input.value += ","+e;
else
 input.value=e;

}



function show(msg,type){

let box=document.getElementById("result");

box.style.display="block";

box.className="result "+type;

box.innerHTML=msg;

}



async function react(){


let btn=document.getElementById("send");

let url=document.getElementById("url").value.trim();

let emoji=document.getElementById("emoji").value
.split(",")
.map(x=>x.trim())
.filter(Boolean)
.join(",");



if(!url){

show("❌ Link wajib diisi","error");
return;

}



if(!emoji){

show("❌ Emoji wajib diisi","error");
return;

}



btn.disabled=true;

btn.innerHTML="⏳ Mengirim...";

show(
"⏳ Memproses reaction...",
"loading"
);



try{


let apiURL =
`${API}?key=${encodeURIComponent(KEY)}&url=${encodeURIComponent(url)}&reaction=${encodeURIComponent(emoji)}`;



let res =
await fetch(apiURL);



let data =
await res.json();



console.log(data);



if(
data.status===false ||
data.error
){

throw new Error(
data.message ||
data.error ||
"API gagal"
);

}



show(`

<h3>✅ Berhasil</h3>

<p>
😀 Emoji :
<b>${emoji}</b>
</p>

<p>
🎯 Target :
WhatsApp Channel
</p>

<p>
🕒 ${new Date().toLocaleString("id-ID")}
</p>

`,
"success");


}catch(e){


show(`

<h3>❌ Gagal</h3>

<p>${e.message}</p>

`,
"error");


}



btn.disabled=false;

btn.innerHTML="⚡ Kirim Reaction";


}


</script>


</body>
</html>
